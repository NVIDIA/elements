name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  schedule:
    - cron: '7 23 * * *' # 11:07 PM America/Chicago
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish pending releases from current main'
        type: boolean
        default: false

permissions:
  contents: read

# Automatic and manual releases share a lock; keep pending requests so an old rerun
# cannot replace the current main revision's pending release.
# PR and queue runs use separate groups and can validate in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release && 'push' || github.event_name }}-${{ github.ref }}
  queue: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)) && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          # Test the integration revision for both PRs and merge queue candidates.
          ref: ${{ github.sha }}
          # The CLI build runs semantic-release dry-run to bake the next binary version.
          # On main, checkout credentials must match the release token used by that dry-run.
          token: ${{ github.ref == 'refs/heads/main' && secrets.RELEASE_TOKEN || github.token }}
      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Select the main branch when requesting a release."
          exit 1
      - uses: $/.github/actions/setup-ci
      - name: Run CI checks
        env:
          ELEMENTS_PAGES_BASE_URL: ${{vars.ELEMENTS_PAGES_BASE_URL}}
          ELEMENTS_REGISTRY_URL: ${{vars.ELEMENTS_REGISTRY_URL}}
          ELEMENTS_REPO_BASE_URL: ${{vars.ELEMENTS_REPO_BASE_URL}}
          GITHUB_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.RELEASE_TOKEN || github.token }}
        run: PAGES_BASE_URL="/elements/" pnpm run ci && PAGES_BASE_URL="/elements/" node ./projects/internals/ci/cache-validate.js ci
      - name: Upload code coverage
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1.4.2
        with:
          file: projects/internals/ci/coverage/cobertura.xml
          language: TypeScript
          label: code-coverage/vitest
          fail-on-error: true
      - name: Write CI job summary
        if: always()
        run: node ./projects/internals/ci/ci-summary.js >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build artifacts
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            projects/core/dist
            projects/core/package.json
            projects/forms/dist
            projects/forms/package.json
            projects/foundations/dist
            projects/foundations/package.json
            projects/styles/dist
            projects/styles/package.json
            projects/themes/dist
            projects/themes/package.json
            projects/lint/dist
            projects/lint/package.json
            projects/cli/dist
            projects/cli/package.json
            projects/code/dist
            projects/code/package.json
            projects/create/dist
            projects/create/package.json
            projects/markdown/dist
            projects/markdown/package.json
            projects/media/dist
            projects/media/package.json
            projects/monaco/dist
            projects/monaco/package.json
            projects/pi/dist
            projects/pi/package.json
            projects/pages/dist
            projects/plot/dist
            projects/plot/package.json
            projects/scene/dist
            projects/scene/package.json
            projects/viewport/dist
            projects/viewport/package.json
      - name: Prepare IndexNow artifacts
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ELEMENTS_PAGES_BASE_URL: ${{vars.ELEMENTS_PAGES_BASE_URL}}
          INDEXNOW_KEY: ${{secrets.INDEXNOW_KEY}}
        run: >-
          node ./projects/internals/ci/indexnow.js prepare
          --site-dir projects/pages/dist
          --site-url "$ELEMENTS_PAGES_BASE_URL"
      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: projects/pages/dist
          include-hidden-files: true
      - name: Upload IndexNow state
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: indexnow-state
          retention-days: 1
          path: projects/pages/dist/indexnow-manifest.json
          overwrite: true

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.sha }}
      - uses: $/.github/actions/setup-ci
      - name: Run Lighthouse tests
        run: >-
          WIREIT_FAILURES=kill mise exec -- pnpm run lighthouse
          && mise exec -- node ./projects/internals/ci/cache-validate.js lighthouse
          && mise exec -- node ./projects/internals/ci/metrics.lighthouse.js
      - name: Write lighthouse job summary
        if: always()
        run: node ./projects/internals/ci/lighthouse-summary.js >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [ci, lighthouse]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.source.outputs.current }}
    permissions:
      issues: write
      deployments: write
      pull-requests: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          # Match the source revision used to produce this run's artifacts.
          ref: ${{ github.sha }}
          # Use RELEASE_TOKEN so the persisted git credentials match the token
          # semantic-release pushes with — otherwise the default GITHUB_TOKEN's
          # http.extraheader overrides @semantic-release/git's push auth.
          token: ${{secrets.RELEASE_TOKEN}}
      - uses: $/.github/actions/setup-ci
        with:
          install-playwright: 'false'
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-artifacts
          path: projects
      - name: Check release source
        id: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote=$(git ls-remote --exit-code origin refs/heads/main)
          current=false
          if [[ "${remote%%$'\t'*}" == "$GITHUB_SHA" ]]; then
            current=true
          else
            echo "Release deferred: main advanced; the latest main run will release pending changes." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Release
        if: steps.source.outputs.current == 'true'
        env:
          # RELEASE_TOKEN must be a PAT or GitHub App token with contents:write and
          # bypass permission for main's branch protection rules. The default
          # GITHUB_TOKEN cannot push tags/release commits to a protected branch.
          GITHUB_TOKEN: ${{secrets.RELEASE_TOKEN}}
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        run: WIREIT_PARALLEL=1 WIREIT_LOGGER=metrics pnpm run release
      - name: Upload MCP server manifest
        if: steps.source.outputs.current == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-server
          retention-days: 1
          path: projects/cli/server.json

  publish-mcp:
    needs: release
    if: needs.release.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    concurrency: mcp-registry-publish
    steps:
      - name: Download MCP server manifest
        uses: actions/download-artifact@v8.0.1
        with:
          name: mcp-server
          path: projects/cli
      - name: Check MCP Registry
        id: registry
        run: |
          path=$(jq -r '[.name, .version] | map(@uri) | join("/versions/")' projects/cli/server.json)
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$path")

          case "$status" in
            200) publish=false ;;
            404) publish=true ;;
            *)
              echo "Unexpected MCP Registry response: HTTP $status" >&2
              exit 1
              ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Publish to MCP Registry
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl --fail --location --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate projects/cli/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish projects/cli/server.json

  deploy-pages:
    needs: [ci, lighthouse]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    concurrency: pages
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .nvmrc
            mise.toml
            projects/internals/ci/indexnow.js
            projects/internals/ci/package.json
          sparse-checkout-cone-mode: false
      - uses: jdx/mise-action@v4.2.0
        with:
          version: 2026.6.14
          install: true
          cache: true
      - name: Download IndexNow state
        uses: actions/download-artifact@v8.0.1
        with:
          name: indexnow-state
          path: indexnow/current
      - name: Determine changed URLs
        env:
          ELEMENTS_PAGES_BASE_URL: ${{vars.ELEMENTS_PAGES_BASE_URL}}
        run: >-
          node ./projects/internals/ci/indexnow.js diff
          --current-file indexnow/current/indexnow-manifest.json
          --site-url "$ELEMENTS_PAGES_BASE_URL"
          --output-file indexnow/payload.json
      - name: Upload IndexNow payload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: indexnow-payload
          retention-days: 30
          path: indexnow/payload.json
          overwrite: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  notify-indexnow:
    needs: deploy-pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .nvmrc
            mise.toml
            projects/internals/ci/indexnow.js
            projects/internals/ci/package.json
          sparse-checkout-cone-mode: false
      - uses: jdx/mise-action@v4.2.0
        with:
          version: 2026.6.14
          install: true
          cache: true
      - name: Download IndexNow payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: indexnow-payload
          path: indexnow
      - name: Notify IndexNow
        env:
          ELEMENTS_PAGES_BASE_URL: ${{vars.ELEMENTS_PAGES_BASE_URL}}
          INDEXNOW_KEY: ${{secrets.INDEXNOW_KEY}}
        run: >-
          node ./projects/internals/ci/indexnow.js submit
          --payload-file indexnow/payload.json
          --site-url "$ELEMENTS_PAGES_BASE_URL"

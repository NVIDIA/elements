StylesPath = config/vale/styles
MinAlertLevel = warning
Vocab = Elements
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip, https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip
Grammars = typescript

[*.{md,ts}]
# Treat warnings from the pinned styles as errors.
Elements.EventDescription = error
Elements.EventEmittedVerb = error
Elements.PackageManagerTerminology = error
Elements.ShadowDOMTerminology = error
Elements.Terminology = error
write-good.Cliches = error
write-good.Illusions = error
write-good.Passive = error
write-good.TooWordy = error
write-good.Weasel = error
# Temporarily disable the adverb rule while its warnings are reviewed.
write-good.Adverbs = NO

[*.md]
BasedOnStyles = Vale, Google, write-good, Elements
Google.Colons = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.OxfordComma = error
Google.Ranges = error
Google.Spelling = error
Google.We = error
Google.Will = error
# Ignore Eleventy shortcodes and template expressions
TokenIgnores = (\{%[\s\S]*?%\}), (\{\{[^}]*\}\}), (\b(?:2d|3d|Validate)\b)
# Disable auto-generated vocabulary case enforcement (custom Elements rules handle terminology)
Vale.Terms = NO
# Disable overly noisy rules for documentation
Google.Headings = NO
Google.WordList = NO
Google.WordListCase = NO
# Summary rules only apply to examples files
Elements.SummaryStyle = NO
Elements.SummaryActionable = NO
Elements.SummaryGerund = NO
Elements.SummaryImplementation = NO

[NOTICE.md]
BasedOnStyles =

[DESIGN.md]
BasedOnStyles =

[PLAN*.md]
BasedOnStyles =

[**/NOTICE.md]
BasedOnStyles =

[**/PLAN*.md]
BasedOnStyles =

[*.ts]
BasedOnStyles = Vale, write-good, Elements
# Reduced rule set for JSDoc - disable rules that produce noise on code identifiers
Vale.Spelling = NO
Vale.Terms = NO
# Summary rules only apply to examples files
Elements.SummaryStyle = NO
Elements.SummaryActionable = NO
Elements.SummaryGerund = NO
Elements.SummaryImplementation = NO

# Examples files: skip HTML tags and template expressions to reduce false positives
[**/src/**/*.examples.ts]
TokenIgnores = (<[/\w][^>]*>), (\$\{[^}]*\})
Elements.SummaryStyle = YES
Elements.SummaryActionable = YES
Elements.SummaryGerund = YES
Elements.SummaryImplementation = YES
